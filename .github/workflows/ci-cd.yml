name: CI/CD Pipeline — Market-Place-Inc

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Redis como servicio para los tests de concurrencia
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            catalog/requirements.txt
            tests/requirements.txt

      - name: Install catalog dependencies
        working-directory: catalog
        run: pip install -r requirements.txt

      - name: Install test dependencies
        working-directory: tests
        run: pip install -r requirements.txt

      - name: Generate gRPC stubs (needed by catalog/main.py)
        working-directory: catalog
        run: |
          python -m grpc_tools.protoc \
            -I . \
            --python_out=. \
            --grpc_python_out=. \
            catalog.proto

      - name: Run tests
        working-directory: .
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest tests/ -v --tb=short

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test   # Solo buildea si los tests pasaron

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build catalog image
        run: docker build -t marketplace/catalog:latest -f catalog/Dockerfile .

      - name: Build orders image
        run: docker build -t marketplace/orders:latest -f orders/Dockerfile .

      - name: Build notifications image
        run: docker build -t marketplace/notifications:latest -f notifications/Dockerfile .
